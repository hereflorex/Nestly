<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ room.name }} · Nestly</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="room-shell"><header class="room-header"><a class="brand" href="/"><span class="brand-mark">N</span>Nestly</a><div><b>{{ room.name }}</b><small>Invite room</small></div><a href="{{ url_for('main.dashboard') }}">Back</a></header><section class="room-messages"><div class="empty-room"><div class="modal-logo">N</div><h1>Welcome to {{ room.name }}</h1><p>Share this private room link with trusted people.</p><code>{{ request.host_url }}rooms/{{ room.code }}</code></div></section><div class="room-composer"><input placeholder="Write a message..." disabled><button disabled>↑</button></div></main></body></html>
