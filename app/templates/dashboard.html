<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard · Nestly</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header class="nav shell"><a class="brand" href="/"><span class="brand-mark">N</span>Nestly</a><a class="outline-btn" href="{{ url_for('main.logout') }}">Logout</a></header><main class="dashboard shell"><div class="eyebrow">ACCOUNT SPACE</div><h1>Welcome, {{ username }}.</h1><p class="muted">Your Nestly workspace is ready.</p><div class="dashboard-grid"><section class="dash-card"><span>01</span><h2>Create a private room</h2><p>Generate an invite link for a specific conversation.</p><form method="post" action="{{ url_for('main.create_room') }}"><button class="primary-btn" type="submit">Create room ↗</button></form></section><section class="dash-card"><span>02</span><h2>Your access</h2><p>Role: <b>{{ role|capitalize }}</b></p><p class="muted">Admin and moderator controls will be enabled through explicit role permissions.</p></section></div></main></body></html>
